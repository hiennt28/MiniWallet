spring:
  application:
    name: miniwallet-backend
  config:
    # File .env ở máy (không commit) chứa mật khẩu DB. Trên server dùng biến môi trường thật.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/miniwallet}
    username: ${DB_USERNAME:miniwallet}
    password: ${DB_PASSWORD:postgres}
  jackson:
    deserialization:
      # "amount": 10000.5 phải bị từ chối, không được lặng lẽ làm tròn thành 10000
      accept-float-as-int: false
  jpa:
    # Không mở kết nối DB suốt quá trình render response; truy vấn chỉ nằm trong service.
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý; Hibernate chỉ kiểm tra entity có khớp bảng hay không.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

app:
  # Múi giờ để tính "tháng này", "ngày 24/11". Dữ liệu trong DB luôn lưu theo UTC.
  time-zone: Asia/Ho_Chi_Minh
  # Tạo tài khoản demo 0912345678 / PIN 147258 kèm ~60 ngày giao dịch nếu chưa có
  demo-data: ${DEMO_DATA:true}
  auth:
    # Khóa ký JWT, Base64, tối thiểu 32 byte. Tạo bằng: openssl rand -base64 48
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    # Không thao tác quá 30 phút thì phải đăng nhập lại (giống frontend)
    refresh-token-ttl: 30m
    issuer: miniwallet
  transfer:
    # Bản demo không có SMS thật: trả mã OTP trong response để giao diện hiển thị "tin nhắn giả lập".
    # Môi trường thật phải đặt EXPOSE_OTP=false và gửi OTP qua một OtpSender gọi nhà mạng.
    expose-otp: ${EXPOSE_OTP:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
